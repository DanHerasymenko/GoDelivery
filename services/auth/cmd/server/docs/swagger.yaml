definitions:
  auth.RefreshReqBody:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  auth.RefreshResp200Body:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.SignInReqBody:
    properties:
      email:
        type: string
      password:
        maxLength: 32
        minLength: 12
        type: string
    required:
    - email
    - password
    type: object
  auth.SignInResp200Body:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.SignUpReqBody:
    properties:
      email:
        type: string
      password:
        maxLength: 32
        minLength: 12
        type: string
    required:
    - email
    - password
    type: object
  healthz.HealthzRespBody:
    properties:
      env:
        type: string
      status:
        type: string
    required:
    - env
    - status
    type: object
info:
  contact: {}
  description: This is a sample server for GoDelivery Auth Service.
  title: GoDelivery Auth Service
  version: "1.0"
paths:
  /api/auth/logout:
    delete:
      description: Logout
      responses:
        "200":
          description: Logout success
          schema:
            type: string
        "401":
          description: access token not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Logout
      tags:
      - Auth
  /api/auth/refresh:
    post:
      description: Refresh
      parameters:
      - description: Refresh request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshReqBody'
      responses:
        "200":
          description: Refresh success
          schema:
            $ref: '#/definitions/auth.RefreshResp200Body'
        "401":
          description: invalid credentials
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Refresh
      tags:
      - Auth
  /api/auth/signin:
    post:
      description: SignIn
      parameters:
      - description: SignIn request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignInReqBody'
      responses:
        "200":
          description: SingIn success
          schema:
            $ref: '#/definitions/auth.SignInResp200Body'
        "401":
          description: invalid credentials
          schema:
            type: string
      summary: SignIn
      tags:
      - Auth
  /api/auth/signup:
    post:
      description: SingUp
      parameters:
      - description: SingUp request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignUpReqBody'
      responses:
        "200":
          description: SingUp success
          schema:
            type: string
        "409":
          description: user already exists
          schema:
            type: string
      summary: SingUp
      tags:
      - Auth
  /api/healthz:
    get:
      consumes:
      - application/json
      description: Healthz check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthz.HealthzRespBody'
        "500":
          description: internal server error
          schema:
            type: string
      summary: Healthz check
      tags:
      - Healthz
swagger: "2.0"
