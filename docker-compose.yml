services:
  postgres:
    image: postgres:17.4
    container_name: postgres_container
    restart: no
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - ${POSTGRES_LOCAL_PORT}:${POSTGRES_CONTAINER_PORT}
    #volumes:
    #  - ./services/auth/db/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $AUTH_POSTGRES_USER -d $AUTH_POSTGRES_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    tty: true
    stdin_open: true

  auth_service:
    build:
      context: .
      target: dev
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - .env
    container_name: auth_service
    volumes:
      - ./services/auth/cmd:/app/cmd
      - ./services/auth/internal:/app/internal
      - ./services/auth/migrations:/app/migrations
    ports:
      - "8081:8081"